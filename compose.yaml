services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: network-diagnostics-monitor:local
    container_name: network-diagnostics-monitor
    environment:
      NDM_MODE: simulated
      NDM_DATABASE_URL: sqlite:////data/network_diagnostics.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ndm-data:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ndm-data:
